global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend discovery
    bind :2375
    acl discovery_path path -m reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version|info|events|containers/json|containers/[a-zA-Z0-9_.-]+/json|networks|networks/[a-zA-Z0-9_.-]+)$
    acl events_path path -m reg ^(/v[0-9]+\.[0-9]+)?/events$
    http-request deny unless METH_GET
    http-request deny unless discovery_path
    use_backend docker_events if events_path
    default_backend docker_metadata

backend docker_metadata
    server socket /var/run/docker.sock

backend docker_events
    timeout server 0
    server socket /var/run/docker.sock
