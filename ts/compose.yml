name: ts

services:
  ts6:
    image: teamspeaksystems/teamspeak6-server:6.0.0-beta13.1@sha256:d845f803aecf842c2df034c959c23ff2462357bacafb3807500885c5ec170fa1
    restart: unless-stopped
    environment:
      TSSERVER_LICENSE_ACCEPTED: "${TSSERVER_LICENSE_ACCEPTED:-not-accepted}"
      TSSERVER_QUERY_HTTP_ENABLED: "1"
      TSSERVER_QUERY_HTTP_PORT: "10080"
      TSSERVER_QUERY_HTTP_ALLOW_GUEST: "0"
      TSSERVER_QUERY_SSH_ALLOW_GUEST: "0"
      TSSERVER_METRICS_ENABLED: "1"
      TSSERVER_METRICS_IP: "0.0.0.0"
    volumes:
      - ./data/ts6:/var/tsserver
    labels:
      ingress.enabled: "true"
      ingress.stream.network: ingress-ts6
      ingress.stream.udp: "9987:9987"
      ingress.stream.tcp: "30033:30033"
    networks:
      proxy: {}
      ts-private:
        aliases:
          - ts6.docker
      monitoring: {}
      ingress-ts6:
        gw_priority: 100

  manager-backend:
    image: clusterzx/ts6-manager:backend@sha256:632cdbb3100496374936192c5575e72e2783d385561820e7baac426e2f8009da
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/packages/backend/data/ts6webui.db
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in ts/.env}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in ts/.env}"
      FRONTEND_URL: "https://${TS_MANAGER_DOMAIN:?Set TS_MANAGER_DOMAIN in ts/.env}"
    volumes:
      - ./data/manager:/app/packages/backend/data
    networks:
      ts-private:
        aliases:
          - backend

  manager-frontend:
    image: clusterzx/ts6-manager:frontend@sha256:4c43304a86a472241e0482179330a307a10119d781fda0204c848d37861d6197
    restart: unless-stopped
    depends_on:
      - manager-backend
    labels:
      ingress.enabled: "${TS_MANAGER_PUBLIC:-false}"
      ingress.http.network: proxy
      ingress.http.host: "${TS_MANAGER_DOMAIN:?Set TS_MANAGER_DOMAIN in ts/.env}"
      ingress.http.port: "80"
    networks:
      - proxy
      - ts-private

  roadie-dj1: &roadie
    image: roadie-local:0.18.0
    build:
      context: ./roadie
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TSBOT_DATA: /data
    volumes:
      - type: bind
        source: ./data/roadie-dj1
        target: /data
        bind:
          create_host_path: false
    depends_on:
      - ts6
      - xray
    networks:
      - ts-private

  roadie-dj2:
    <<: *roadie
    volumes:
      - type: bind
        source: ./data/roadie-dj2
        target: /data
        bind:
          create_host_path: false

  roadie-dj3:
    <<: *roadie
    volumes:
      - type: bind
        source: ./data/roadie-dj3
        target: /data
        bind:
          create_host_path: false

  xray:
    image: ghcr.io/xtls/xray-core:26.9.30@sha256:6d30597c3e729b5dc1faac8dbc0138fbbe6d4d787bfb54120ea48f14e2e7b5ca
    restart: unless-stopped
    command: ["run", "-config", "/usr/local/etc/xray/config.json"]
    volumes:
      - type: bind
        source: ./xray
        target: /usr/local/etc/xray
        read_only: true
        bind:
          create_host_path: false
    networks:
      - ts-private

networks:
  proxy:
    external: true
  monitoring:
    external: true
  ts-private:
    driver: bridge
  ingress-ts6:
    external: true
